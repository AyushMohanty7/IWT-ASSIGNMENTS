<!DOCTYPE html>
<html>
<head>
    <title>Master DOM Practice</title>
    <script>
        // 1. Background Color Changer
        function abc() {
            var a = document.getElementById("x").value;
            if (a == "red") document.bgColor = "red";
            else if (a == "green") document.bgColor = "green";
            else if (a == "blue") document.bgColor = "blue";
            else if (a == "yellow") document.bgColor = "yellow";
            else document.bgColor = "white";
        }

        // 2. Header Update
        function func() {
            document.getElementsByTagName("h1")[0].innerHTML = "Welcome to Silicon";
        }

        // 3. Addition Logic
        function add() {
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var sum = n1 + n2;
            document.getElementById("result").innerHTML = "Total: " + sum;
        }
    </script>
</head>
<body>

    <h1 id="heading1">Hello World</h1>

    <!-- Background & Header Section -->
    <select id="x" onchange="abc()">
        <option value="none">none</option>
        <option value="red">red</option>
        <option value="green">green</option>
        <option value="blue">blue</option>
    </select>
    <button onclick="func()">Update Title</button>

    <hr>

    <!-- NEW: List Item Section (from your image) -->
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>

    <script>
        // Loop through all <li> elements and write them to the page
        const items = document.getElementsByTagName("li");
        for (let i = 0; i < items.length; i++) {
            document.write("List item found: " + items[i].innerHTML + "<br>");
        }
    </script>

    <hr>

    <!-- NEW: Paragraph Manipulation (from your image) -->
    <p>Original text</p>
    <p>Another paragraph</p>

    <script>
        // [1] targets the SECOND paragraph because counting starts at 0
        document.getElementsByTagName("p")[1].innerHTML = "Hello World! (Changed by Script)";
    </script>

    <hr>

    <!-- Calculator Section -->
    <div>
        <input type="number" id="num1" placeholder="Num 1"> +
        <input type="number" id="num2" placeholder="Num 2">
        <button onclick="add()">Sum</button>
        <h4 id="result">Total: 0</h4>
    </div>

</body>
</html>
