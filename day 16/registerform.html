<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 40px; background: #f9f9f9; color: #333; }
        .form-card { background: #fff; width: 350px; border: 1px solid #000; padding: 20px; }
        h2 { margin: 0 0 20px 0; text-align: center; border-bottom: 1px solid #000; padding-bottom: 10px; font-size: 1.2rem; }
        
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #000; box-sizing: border-box; font-family: inherit; }
        
        .radio-group { font-size: 0.9rem; padding: 5px 0; }
        .radio-group input { width: auto; margin-right: 5px; }
        
        #error-msg { background: #000; color: #fff; padding: 10px; font-size: 0.75rem; margin-bottom: 15px; display: none; text-align: center; }
        
        button { width: 100%; padding: 12px; background: #000; color: #fff; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #333; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>REGISTRATION</h2>
    <div id="error-msg"></div>

    <form id="regForm">
        <div class="field">
            <label>Name:</label>
            <input type="text" id="name">
        </div>

        <div class="field">
            <label>Gender:</label>
            <div class="radio-group">
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
            </div>
        </div>

        <div class="field">
            <label>Mobile Number:</label>
            <input type="text" id="mobile" placeholder="10 digits">
        </div>

        <div class="field">
            <label>Address:</label>
            <textarea id="address" rows="2"></textarea>
        </div>

        <div class="field">
            <label>Country:</label>
            <select id="country">
                <option value="">--Select--</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="Nepal">Nepal</option>
            </select>
        </div>

        <div class="field">
            <label>Email:</label>
            <input type="text" id="email">
        </div>

        <div class="field">
            <label>Password:</label>
            <input type="password" id="password" placeholder="6-15 characters">
        </div>

        <button type="submit">Submit</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
